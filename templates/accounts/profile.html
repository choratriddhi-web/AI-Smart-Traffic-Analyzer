{% extends 'base.html' %}

{% block title %}User Profile - AI Smart Traffic Analyzer{% endblock %}
{% block page_title %}<i class="bi bi-person-badge-fill text-purple"></i> Account Profile & Security{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="traffic-card glow-purple p-4">
            <div class="card-header-custom">
                <h5 class="card-title-custom"><i class="bi bi-person-lines-fill text-purple"></i> Profile Information</h5>
                <span class="badge bg-purple">{{ user.role }}</span>
            </div>

            <form method="POST" action="{% url 'accounts:profile' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-white small fw-bold">Username</label>
                    <input type="text" class="form-control form-control-custom bg-secondary bg-opacity-10 text-muted" value="{{ user.username }}" disabled>
                    <small class="text-dim">Username cannot be altered.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label text-white small fw-bold">Email Address</label>
                    <input type="email" class="form-control form-control-custom bg-secondary bg-opacity-10 text-muted" value="{{ user.email }}" disabled>
                </div>

                <div class="mb-3">
                    <label class="form-label text-white small fw-bold">Full Name</label>
                    <input type="text" name="full_name" class="form-control form-control-custom" value="{{ user.full_name|default:'' }}">
                </div>

                <div class="mb-4">
                    <label class="form-label text-white small fw-bold">Contact Phone</label>
                    <input type="tel" name="phone" class="form-control form-control-custom" value="{{ user.phone|default:'' }}">
                </div>

                <hr class="border-secondary opacity-20 my-4">

                <h6 class="text-cyan fw-bold mb-3"><i class="bi bi-shield-lock"></i> Change Password</h6>
                <div class="mb-4">
                    <label class="form-label text-white small fw-bold">New Password (leave blank to keep current)</label>
                    <input type="password" name="new_password" class="form-control form-control-custom" placeholder="New password">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <button type="submit" class="btn btn-purple px-4">
                        <i class="bi bi-save me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
