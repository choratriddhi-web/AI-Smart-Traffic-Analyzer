<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | AI Smart Traffic Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: #0b0816;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .error-card {
            background: rgba(19, 10, 36, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 16px;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.25);
            padding: 2.5rem;
            max-width: 550px;
            text-align: center;
        }
        .btn-purple {
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            border: none;
            color: #fff;
            font-weight: 600;
        }
        .btn-purple:hover {
            opacity: 0.95;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="mb-3">
            <span class="display-2 fw-bold" style="background: linear-gradient(135deg, #ef4444 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                500
            </span>
        </div>
        <h4 class="fw-bold mb-2">Temporary Telemetry Offline</h4>
        <p class="text-secondary small mb-4">
            The traffic server encountered an unexpected situation. Core services are auto-restarting. Please reload or return to the gateway.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="/" class="btn btn-purple px-4 py-2">
                <i class="bi bi-house-door-fill me-1"></i> Return to Gateway
            </a>
            <button onclick="window.location.reload()" class="btn btn-outline-light px-4 py-2">
                <i class="bi bi-arrow-clockwise me-1"></i> Reload
            </button>
        </div>
    </div>
</body>
</html>
